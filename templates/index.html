<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>非營利組織財務報表自動檢核系統</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <header>
            <h1>NPO 財務報表自動檢核</h1>
            <p>上傳您的 Excel 報表，系統將自動檢查財務數據合規性與邏輯錯誤。</p>
        </header>

        <main>
            <div class="card upload-section">
                <h2>1. 下載範本 (建議)</h2>
                <p>使用標準範本可確保檢核最準確。</p>
                <a href="/download_template" class="btn secondary">下載 Excel 範本</a>

                <div class="separator"></div>

                <h2>2. 設定 (選填)</h2>

                <div class="options-container">
                    <div class="option-group">
                        <label class="toggle-switch">
                            <input type="checkbox" id="aiToggle">
                            <span class="slider"></span>
                            <span class="label-text">啟用格式轉換 (針對舊版/非標準 Excel)</span>
                        </label>
                    </div>

                    <div class="option-group api-group">
                        <label for="apiKey">
                            <span class="label-title">Gemini API Key (針對 PDF/圖片/手寫)</span>
                            <span class="label-desc">若要處理掃描檔或手寫稿，請輸入您的 Google Gemini API Key。</span>
                        </label>
                        <input type="password" id="apiKey" placeholder="請在此貼上 sk-..." class="input-text">
                        <div class="help-text">
                            <a href="https://aistudio.google.com/app/apikey" target="_blank">取得您的 API Key</a>
                            (您的金鑰僅用於本次運算，不會被儲存)
                        </div>
                    </div>
                </div>

                <div class="separator"></div>

                <h2>3. 上傳報表</h2>
                <div class="drop-zone" id="dropZone">
                    <p>拖拉 Excel / PDF / 圖片 至此或是 <span>點擊上傳</span></p>
                    <input type="file" id="fileInput" accept=".xlsx,.xlsm,.pdf,.jpg,.jpeg,.png" hidden>
                    <div id="fileName" class="file-name"></div>
                </div>
                <button id="verifyBtn" class="btn primary" disabled>開始檢核</button>
            </div>

            <div id="loading" class="hidden">
                <div class="spinner"></div>
                <p>正在分析您的報表...</p>
                <p class="sub-text" id="aiText"></p>
            </div>

            <div id="resultsSection" class="hidden">
                <h2>檢核結果</h2>
                <div class="summary-cards">
                    <div class="summary-card total">
                        <span class="label">檢核項目</span>
                        <span class="value" id="totalChecks">0</span>
                    </div>
                    <div class="summary-card error">
                        <span class="label">異常 (Error)</span>
                        <span class="value" id="totalErrors">0</span>
                    </div>
                    <div class="summary-card warning">
                        <span class="label">警示 (Warning)</span>
                        <span class="value" id="totalWarnings">0</span>
                    </div>
                    <div class="summary-card ok">
                        <span class="label">通過 (Pass)</span>
                        <span class="value" id="totalOk">0</span>
                    </div>
                </div>

                <div class="results-list" id="resultsList">
                    <!-- Results injected here -->
                </div>
            </div>
        </main>
    </div>

    <script src="/static/script.js"></script>
    <style>
        .options {
            margin-bottom: 2rem;
        }

        .toggle-switch {
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .toggle-switch input {
            display: none;
        }

        .slider {
            width: 40px;
            height: 20px;
            background: #ccc;
            border-radius: 20px;
            position: relative;
            transition: .4s;
            margin-right: 10px;
        }

        .slider:before {
            content: "";
            position: absolute;
            height: 16px;
            width: 16px;
            left: 2px;
            bottom: 2px;
            background: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background: #2563eb;
        }

        input:checked+.slider:before {
            transform: translateX(20px);
        }

        .sub-text {
            font-size: 0.8rem;
            color: #64748b;
        }
    </style>
</body>

</html>
