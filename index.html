<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NPO 財務報表自動檢核系統 (Pro)</title>
    <link rel="stylesheet" href="css/style.css">

    <!-- External Libraries -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <script type="importmap">
      {
        "imports": {
          "@google/generative-ai": "https://esm.run/@google/generative-ai"
        }
      }
    </script>
</head>

<body>

    <!-- Background Elements -->
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>
    <div class="bg-shape shape-3"></div>

    <header>
        <h1>NPO Financial Guard</h1>
        <p>專業非營利組織財務報表自動化檢核系統</p>
    </header>

    <div class="container">

        <!-- Step 1: Configuration -->
        <section class="card">
            <h2>1. 系統設定</h2>
            <div class="input-group">
                <label for="apiKey">Gemini API Key (選填，用於 PDF/圖片 辨識)</label>
                <input type="text" id="apiKey" placeholder="貼上您的 API Key...">
            </div>
            <p style="color: var(--text-muted); font-size: 0.9em;">* API Key 僅在瀏覽器端使用，不會上傳至任何伺服器。</p>
        </section>

        <!-- Step 2: Upload -->
        <section class="card">
            <h2>2. 上傳報表</h2>
            <div class="upload-area" id="dropZone">
                <p>拖曳檔案至此或點擊上傳</p>
                <input type="file" id="fileInput" accept=".xlsx,.xls,.pdf,.png,.jpg,.jpeg" hidden>
            </div>
            <div id="loading" style="display: none; text-align: center;">
                <div class="spinner"></div>
                <p>AI 分析運算中，請稍候...</p>
            </div>
        </section>

        <!-- Step 3: Result -->
        <section id="resultSection" class="card" style="display: none;">
            <h2>3. 檢核報告</h2>
            <div id="summary"></div>

            <table class="result-table">
                <thead>
                    <tr>
                        <th width="15%">報表類別</th>
                        <th width="15%">檢核項目</th>
                        <th width="10%">狀態</th>
                        <th width="20%">檢核結果</th>
                        <th width="20%">異常意義</th>
                        <th width="20%">修正建議</th>
                    </tr>
                </thead>
                <tbody id="resultTableBody">
                    <!-- Results injected here -->
                </tbody>
            </table>

            <div style="margin-top: 30px; text-align: center;">
                <button class="btn" onclick="downloadExcel()">下載完整 Excel 報告</button>
            </div>
        </section>

    </div>

    <footer>
        <p>Copyright © Liyuchiutiger Gongminshen | Professional NPO Audit System</p>
    </footer>

    <!-- Application Logic -->
    <script type="module" src="js/main.js"></script>
    <script type="module">
        import { main } from './js/main.js';
        // Expose function for button
        window.downloadExcel = main.downloadExcel; 
    </script>
</body>

</html>
